gesture_recognition_node:
  ros__parameters:
    config_path: ""
    lazy_load: true
    score_threshold: 0.25
    image_topic: "/camera/image_raw"   # 直连摄像头时发布到此话题；订阅模式时从此话题收图
    gestures_topic: "/perception/gestures"
    boxes_topic: "/gesture_recognition/boxes"
    debug_image_topic: "/gesture_recognition/debug_image"
    # Must match model_zoo assets/labels/gesture.txt class order.
    labels: ["ok", "stop", "palm", "like", "dislike", "no_gesture", "call", "fist", "four", "mute", "one", "peace", "peace_inverted", "rock", "stop_inverted", "three", "three2", "two_up", "two_up_inverted"]
    use_camera: true    # true=直连摄像头并发布 /camera/image_raw；false=订阅 image_topic
    camera_id: 1
    camera_fps: 30.0
